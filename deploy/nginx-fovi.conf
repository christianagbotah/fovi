# ============================================================
# Fovi AI — nginx configuration for VPS deployment
# Place at /etc/nginx/sites-available/fovi.lightworldtech.com
# Then: sudo ln -sf .../fovi.lightworldtech.com /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
# ============================================================

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

upstream fovi_app { server 127.0.0.1:3000; keepalive 64; }
upstream fovi_market { server 127.0.0.1:3003; keepalive 32; }

server {
    listen 80;
    server_name fovi.lightworldtech.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fovi.lightworldtech.com;

    ssl_certificate     /etc/letsencrypt/live/fovi.lightworldtech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fovi.lightworldtech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;

    client_max_body_size 10M;

    # Main app
    location / {
        proxy_pass http://fovi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Socket.io WebSocket for market data
    location /socket.io/ {
        proxy_pass http://fovi_market;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Auth rate limiting at nginx level (defense in depth)
    location /api/auth/signin {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://fovi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/signup {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://fovi_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
