<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle grid lines (trading chart feel) -->
  <line x1="80" y1="160" x2="432" y2="160" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="80" y1="240" x2="432" y2="240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="160" y1="80" x2="160" y2="432" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="256" y1="80" x2="256" y2="432" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="352" y1="80" x2="352" y2="432" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- F letterform -->
  <!-- Vertical bar of F -->
  <rect x="88" y="96" width="68" height="320" rx="12" fill="url(#accent)"/>

  <!-- Top horizontal bar of F -->
  <rect x="88" y="96" width="256" height="68" rx="12" fill="url(#accent)"/>

  <!-- Middle horizontal bar of F -->
  <rect x="88" y="224" width="192" height="56" rx="12" fill="url(#accent2)"/>

  <!-- Trend arrow replacing the dot of the i -->
  <g transform="translate(308, 168)">
    <!-- i dot / chart node -->
    <circle cx="48" cy="48" r="20" fill="url(#accent)"/>
    <!-- Upward arrow from the i dot -->
    <path d="M48 28 L48 8" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 18 L48 6 L58 18" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Subtle candlestick silhouettes in background -->
  <rect x="370" y="310" width="12" height="60" rx="3" fill="#10b981" fill-opacity="0.15"/>
  <line x1="376" y1="290" x2="376" y2="385" stroke="#10b981" stroke-opacity="0.1" stroke-width="2"/>
  <rect x="392" y="280" width="12" height="50" rx="3" fill="#ef4444" fill-opacity="0.1"/>
  <line x1="398" y1="265" x2="398" y2="345" stroke="#ef4444" stroke-opacity="0.07" stroke-width="2"/>
  <rect x="414" y="260" width="12" height="45" rx="3" fill="#10b981" fill-opacity="0.12"/>
  <line x1="420" y1="245" x2="420" y2="320" stroke="#10b981" stroke-opacity="0.08" stroke-width="2"/>
</svg>