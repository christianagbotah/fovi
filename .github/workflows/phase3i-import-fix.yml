name: Phase 3I Import Fix

on:
  push:
    branches:
      - phase-3i-memory-only-access-tokens
    paths:
      - '.github/workflows/phase3i-import-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3i-memory-only-access-tokens
      - name: Restore central authFetch import alongside bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/page.tsx')
          src = path.read_text()
          before = "import { bootstrapBrowserAuth } from '@/lib/api-fetch';"
          after = "import { authFetch, bootstrapBrowserAuth } from '@/lib/api-fetch';"
          if before not in src:
              raise SystemExit('expected Phase 3I import shape not found')
          path.write_text(src.replace(before, after, 1))
          PY
          grep -q "import { authFetch, bootstrapBrowserAuth } from '@/lib/api-fetch';" src/app/page.tsx
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git rm .github/workflows/phase3i-import-fix.yml
          git commit -m "fix(auth): preserve dashboard authenticated fetch import"
          git push origin HEAD:phase-3i-memory-only-access-tokens
