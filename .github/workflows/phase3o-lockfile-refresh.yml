name: Phase 3O Lockfile Refresh

on:
  push:
    branches:
      - phase-3o-two-factor-revocation-layout

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-3o-two-factor-revocation-layout
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.4

      - name: Pin patched Browserslist and refresh its dependency closure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = pkg.overrides || {};
          pkg.overrides.browserslist = '4.28.8';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          bun update browserslist caniuse-lite electron-to-chromium node-releases update-browserslist-db baseline-browser-mapping

      - name: Commit refreshed dependency boundary when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json bun.lock; then
            echo 'Dependency boundary already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'chore(deps): refresh browserslist dependency closure'
          git push origin HEAD:phase-3o-two-factor-revocation-layout
