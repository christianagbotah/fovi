name: Phase 3Q Containment Diagnostic

on:
  push:
    branches:
      - phase-3q-auth-surface-finalization

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Group A-C
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[a-c][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group D-F
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[d-f][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group G-I
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[g-i][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group J-L
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[j-l][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group M-O
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[m-o][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group P-R
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[p-r][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group S-U excluding supply-chain
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[s-u][^/]*\.test\.ts$' | grep -v '/supply-chain-security.test.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
      - name: Group V-Z
        continue-on-error: true
        run: |
          files=$(find src/__tests__/containment -maxdepth 1 -type f -name '*.test.ts' | sort | grep -Ei '/[v-z][^/]*\.test\.ts$' || true)
          [ -z "$files" ] || bunx vitest run $files
