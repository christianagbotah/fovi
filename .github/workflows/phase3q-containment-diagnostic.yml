name: Phase 3Q Containment Diagnostic

on:
  push:
    branches:
      - phase-3q-auth-surface-finalization

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run containment and expose exact failure
        run: |
          set +e
          bunx vitest run src/__tests__/containment --reporter=verbose > /tmp/containment.log 2>&1
          status=$?
          {
            echo '### Phase 3Q containment diagnostic'
            echo '```text'
            tail -n 220 /tmp/containment.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/containment.log
          exit "$status"
