name: Phase 3Q Containment Diagnostic

on:
  push:
    branches:
      - phase-3q-auth-surface-finalization

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: auth-surface-finalization
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/auth-surface-finalization.test.ts
      - name: one-time-bound-otp
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/one-time-bound-otp.test.ts
      - name: auth-boundary-hardening
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/auth-boundary-hardening.test.ts
      - name: two-factor-challenge-supersession
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/two-factor-challenge-supersession.test.ts
      - name: auth-before-fallback
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/auth-before-fallback.test.ts
      - name: auth-response-cache
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/auth-response-cache.test.ts
      - name: proxy-auth
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/proxy-auth.test.ts
      - name: no-demo-identity
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/no-demo-identity.test.ts
      - name: credential-session-revocation
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/credential-session-revocation.test.ts
      - name: auth-session-retention
        continue-on-error: true
        run: bunx vitest run src/__tests__/containment/auth-session-retention.test.ts
