name: Phase 3D Supply Chain Security Qualification

on:
  push:
    branches:
      - phase-1-emergency-containment
  pull_request:
    branches:
      - phase-1-emergency-containment
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Immutable CI inputs and high-severity dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Verify package-manager and lockfile boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(bun --version)" = '1.3.4'
          for lockfile in \
            bun.lock \
            mini-services/auto-trade-engine/bun.lock \
            mini-services/balance-sync/bun.lock \
            mini-services/market-service/bun.lock; do
            test -s "$lockfile"
            echo "Verified lockfile: $lockfile"
          done

      - name: Frozen install every package scope
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          for service in auto-trade-engine balance-sync market-service; do
            (cd "mini-services/${service}" && bun install --frozen-lockfile)
          done

      - name: Block high and critical dependency advisories
        shell: bash
        run: |
          set -euo pipefail
          for scope in \
            . \
            mini-services/auto-trade-engine \
            mini-services/balance-sync \
            mini-services/market-service; do
            echo "Auditing ${scope}"
            (cd "$scope" && bun audit --audit-level=high)
          done

      - name: Supply-chain policy regression
        run: bunx vitest run src/__tests__/containment/supply-chain-security.test.ts
