name: Phase 3N Schema Codemod

on:
  push:
    branches:
      - phase-3n-one-time-2fa-challenges
    paths:
      - '.github/workflows/phase3n-schema-codemod.yml'
      - 'scripts/phase3n-schema-codemod.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3N branch
        uses: actions/checkout@v4
        with:
          ref: phase-3n-one-time-2fa-challenges
          fetch-depth: 0

      - name: Apply deterministic Prisma schema update
        run: node scripts/phase3n-schema-codemod.mjs

      - name: Validate Prisma schema with repository-pinned major
        run: npx --yes prisma@6.19.3 validate

      - name: Commit schema and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma
          git rm scripts/phase3n-schema-codemod.mjs .github/workflows/phase3n-schema-codemod.yml
          git commit -m "feat(auth): model one-time 2FA challenges"
          git push origin HEAD:phase-3n-one-time-2fa-challenges
