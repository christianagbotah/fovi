name: Phase 3C Runtime Fault Recovery Qualification

on:
  pull_request:
    branches:
      - phase-1-emergency-containment
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-fault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production
  POSTGRES_IMAGE: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
  DATABASE_URL: postgresql://fovi_ci:fovi_ci_runtime_pw@127.0.0.1:5432/fovi_ci
  JWT_SECRET: ci-fault-jwt-secret-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
  AUTH_PEPPER: ci-fault-auth-pepper-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
  ENCRYPTION_KEY: ci-fault-encryption-key-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
  INTERNAL_SERVICE_SECRET: ci-fault-internal-secret-${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef
  APP_URL: https://fault-runtime.fovi.invalid
  NEXT_PUBLIC_APP_URL: https://fault-runtime.fovi.invalid
  AUTOMATED_TRADING_ENABLED: 'false'
  PAPER_AUTOMATED_EXECUTION_ENABLED: 'false'
  ENABLE_BALANCE_SYNC: 'false'
  BALANCE_SYNC_ENABLED: 'false'
  ENABLE_BROKER_CREDENTIAL_INTAKE: 'false'

jobs:
  qualify:
    name: Database loss, fail-closed health, and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: fovi_ci
          POSTGRES_PASSWORD: fovi_ci_runtime_pw
          POSTGRES_DB: fovi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fovi_ci -d fovi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          for service in auto-trade-engine balance-sync market-service; do
            (cd "mini-services/${service}" && bun install --frozen-lockfile)
          done

      - name: Bootstrap database and build production application
        shell: bash
        run: |
          set -euo pipefail
          bunx prisma generate
          bun run scripts/migrate-production.ts
          bun run build

      - name: Start contained runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime-logs .fault

          bunx next start --port 3002 > .runtime-logs/next.log 2>&1 &
          echo $! > .runtime-logs/next.pid

          (cd mini-services/market-service && bun index.ts) > .runtime-logs/market.log 2>&1 &
          echo $! > .runtime-logs/market.pid

          (cd mini-services/auto-trade-engine && bun index.ts) > .runtime-logs/engine.log 2>&1 &
          echo $! > .runtime-logs/engine.pid

          (cd mini-services/balance-sync && bun index.ts) > .runtime-logs/balance.log 2>&1 &
          echo $! > .runtime-logs/balance.pid

      - name: Establish healthy baseline and database fingerprint
        shell: bash
        run: |
          set -euo pipefail
          wait_healthy() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 30); do
              if curl -fsS "$url" > "/tmp/${name}-baseline.json"; then
                return 0
              fi
              sleep 2
            done
            echo "${name} did not become healthy" >&2
            return 1
          }

          wait_healthy next http://127.0.0.1:3002/api/health
          wait_healthy market http://127.0.0.1:3003/health
          wait_healthy engine http://127.0.0.1:3012/health
          wait_healthy balance http://127.0.0.1:3013/health

          jq -e '.status == "healthy" and .checks.database.ok == true' /tmp/next-baseline.json
          jq -e '.status == "ok"' /tmp/market-baseline.json
          jq -e '.status == "ok" and .automatedTradingEnabled == false and .readiness == "disabled"' /tmp/engine-baseline.json
          jq -e '.status == "ok" and .dbReady == true and .balanceSyncEnabled == false' /tmp/balance-baseline.json

          db_container=$(docker ps --filter "ancestor=${POSTGRES_IMAGE}" --filter 'status=running' --format '{{.ID}}' | head -n 1)
          test -n "$db_container"
          echo "DB_CONTAINER=$db_container" >> "$GITHUB_ENV"

          docker exec "$db_container" psql -U fovi_ci -d fovi_ci -At \
            -c 'SELECT migration_name FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name' \
            > .fault/migrations-before.txt
          test -s .fault/migrations-before.txt
          sha256sum .fault/migrations-before.txt | tee .fault/migrations-before.sha256

      - name: Stop PostgreSQL and require fail-closed health
        shell: bash
        run: |
          set -euo pipefail
          docker stop "$DB_CONTAINER"

          wait_for_degraded() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 30); do
              code=$(curl -sS -o "/tmp/${name}-down.json" -w '%{http_code}' "$url" || true)
              if [ "$code" = '503' ] && jq -e '.status == "degraded"' "/tmp/${name}-down.json" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "${name} did not report dependency loss" >&2
            cat "/tmp/${name}-down.json" 2>/dev/null || true
            return 1
          }

          wait_for_degraded next http://127.0.0.1:3002/api/health
          wait_for_degraded balance http://127.0.0.1:3013/health
          jq -e '.checks.database.ok == false' /tmp/next-down.json
          jq -e '.dbReady == false and .balanceSyncEnabled == false' /tmp/balance-down.json

          curl -fsS http://127.0.0.1:3003/health | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:3012/health | jq -e '.status == "ok" and .automatedTradingEnabled == false and .readiness == "disabled"'

          engine_status=$(curl -sS -o /tmp/engine-down-cycle.json -w '%{http_code}' \
            -X POST -H "X-Internal-Service-Secret: ${INTERNAL_SERVICE_SECRET}" \
            http://127.0.0.1:3012/cycle)
          test "$engine_status" = '403'
          jq -e '.code == "PHASE1_LIVE_TRADING_DISABLED"' /tmp/engine-down-cycle.json

          balance_status=$(curl -sS -o /tmp/balance-down-sync.json -w '%{http_code}' \
            -X POST -H "X-Internal-Service-Secret: ${INTERNAL_SERVICE_SECRET}" \
            http://127.0.0.1:3013/sync)
          test "$balance_status" = '403'
          jq -e '.code == "PHASE1_LIVE_TRADING_DISABLED"' /tmp/balance-down-sync.json

      - name: Restart PostgreSQL and require automatic recovery
        shell: bash
        run: |
          set -euo pipefail
          docker start "$DB_CONTAINER"

          for attempt in $(seq 1 30); do
            if docker exec "$DB_CONTAINER" pg_isready -U fovi_ci -d fovi_ci >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = '30' ]; then
              echo 'PostgreSQL did not recover' >&2
              exit 1
            fi
            sleep 2
          done

          wait_for_recovered() {
            local name="$1"
            local url="$2"
            for attempt in $(seq 1 30); do
              code=$(curl -sS -o "/tmp/${name}-recovered.json" -w '%{http_code}' "$url" || true)
              if [ "$code" = '200' ]; then
                return 0
              fi
              sleep 2
            done
            echo "${name} did not recover after PostgreSQL restart" >&2
            cat "/tmp/${name}-recovered.json" 2>/dev/null || true
            return 1
          }

          wait_for_recovered next http://127.0.0.1:3002/api/health
          wait_for_recovered balance http://127.0.0.1:3013/health
          jq -e '.status == "healthy" and .checks.database.ok == true' /tmp/next-recovered.json
          jq -e '.status == "ok" and .dbReady == true and .balanceSyncEnabled == false' /tmp/balance-recovered.json

          docker exec "$DB_CONTAINER" psql -U fovi_ci -d fovi_ci -At \
            -c 'SELECT migration_name FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name' \
            > .fault/migrations-after.txt
          cmp .fault/migrations-before.txt .fault/migrations-after.txt

          engine_status=$(curl -sS -o /tmp/engine-recovered-cycle.json -w '%{http_code}' \
            -X POST -H "X-Internal-Service-Secret: ${INTERNAL_SERVICE_SECRET}" \
            http://127.0.0.1:3012/cycle)
          test "$engine_status" = '403'

          balance_status=$(curl -sS -o /tmp/balance-recovered-sync.json -w '%{http_code}' \
            -X POST -H "X-Internal-Service-Secret: ${INTERNAL_SERVICE_SECRET}" \
            http://127.0.0.1:3013/sync)
          test "$balance_status" = '403'

      - name: Upload runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-3c-runtime-logs-${{ github.run_id }}
          path: .runtime-logs/
          if-no-files-found: ignore
          retention-days: 7
