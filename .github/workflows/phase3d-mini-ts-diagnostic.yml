name: Phase 3D Bun Type Alignment Probe

on:
  push:
    branches:
      - phase-3d-supply-chain-security

permissions:
  contents: read

concurrency:
  group: phase3d-bun-type-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Bun 1.3.4 type alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Align Bun types to runtime
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile >/dev/null
          bun add --dev --exact bun-types@1.3.4 >/dev/null
          bun install --frozen-lockfile >/dev/null
          for service in auto-trade-engine balance-sync market-service; do
            (cd "mini-services/${service}" && bun install --frozen-lockfile >/dev/null)
          done
          grep -F '"bun-types": "1.3.4"' package.json

      - name: Re-prove security and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          bun audit --audit-level=high
          bunx prisma generate >/dev/null
          bunx tsc --noEmit --pretty false
          bunx tsc -p mini-services/tsconfig.json --pretty false
          git diff --check
          git diff -- package.json bun.lock > /tmp/bun-type-alignment.patch
          test -s /tmp/bun-type-alignment.patch
