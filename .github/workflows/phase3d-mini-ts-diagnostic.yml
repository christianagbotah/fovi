name: Phase 3D Mini-Service Type Diagnostic

on:
  push:
    branches:
      - phase-3d-supply-chain-security

permissions:
  contents: read

concurrency:
  group: phase3d-mini-ts-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Mini-service TypeScript diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Install exact dependency graph quietly
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile >/dev/null
          for service in auto-trade-engine balance-sync market-service; do
            (cd "mini-services/${service}" && bun install --frozen-lockfile >/dev/null)
          done

      - name: Print only mini-service compiler diagnostics
        shell: bash
        run: |
          set +e
          bunx tsc -p mini-services/tsconfig.json --pretty false > /tmp/mini-ts-errors.txt 2>&1
          status=$?
          cat /tmp/mini-ts-errors.txt
          echo "MINI_TS_EXIT=${status}"
          exit "$status"
