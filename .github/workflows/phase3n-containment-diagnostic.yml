name: Phase 3N Containment Diagnostic

on:
  push:
    branches:
      - phase-3n-one-time-2fa-challenges
    paths:
      - '.github/workflows/phase3n-containment-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3n-one-time-2fa-challenges
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Capture containment output
        shell: bash
        run: |
          set +e
          bun run test:containment-only > phase3n-containment-diagnostic.txt 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> phase3n-containment-diagnostic.txt
          exit 0
      - name: Publish diagnostic output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase3n-containment-diagnostic.txt
          git commit -m "chore(auth): publish Phase 3N containment diagnostic"
          git push origin HEAD:phase-3n-one-time-2fa-challenges
