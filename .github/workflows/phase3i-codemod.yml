name: Phase 3I Memory Token Codemod

on:
  push:
    branches:
      - phase-3i-memory-only-access-tokens
    paths:
      - '.github/workflows/phase3i-codemod.yml'
      - 'scripts/phase3i-memory-token-codemod.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 3I branch
        uses: actions/checkout@v4
        with:
          ref: phase-3i-memory-only-access-tokens
          fetch-depth: 0

      - name: Apply deterministic memory-token migration
        run: node scripts/phase3i-memory-token-codemod.mjs

      - name: Verify access JWT is not persisted
        run: |
          if grep -R "localStorage.setItem(['\"]fovi_token" -n src --include='*.ts' --include='*.tsx' --exclude-dir='__tests__'; then
            echo 'Persistent fovi_token write remains in runtime source' >&2
            exit 1
          fi
          if grep -R "localStorage.getItem(['\"]fovi_token" -n src --include='*.ts' --include='*.tsx' --exclude-dir='__tests__'; then
            echo 'Persistent fovi_token read remains in runtime source' >&2
            exit 1
          fi

      - name: Commit migration and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store/trading-store.ts src/app/page.tsx
          git rm scripts/phase3i-memory-token-codemod.mjs .github/workflows/phase3i-codemod.yml
          git commit -m "fix(auth): bootstrap browser auth from HttpOnly refresh session"
          git push origin HEAD:phase-3i-memory-only-access-tokens
