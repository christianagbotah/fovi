name: Phase 3D Dependency Remediation Apply

on:
  push:
    branches:
      - phase-3d-supply-chain-security

permissions:
  contents: write

concurrency:
  group: phase3d-remediation-apply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: apply audited dependency artifact' }}"
    name: Apply exact audited root dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Download and verify exact audited artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9774517032'
          ARTIFACT_SHA256: '3f0ff313d078cc36f6c085f5ee1577f5d330a72699e7adfa87439260d7527459'
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase3d-audited
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/phase3d-audited.zip
          echo "${ARTIFACT_SHA256}  /tmp/phase3d-audited.zip" | sha256sum -c -
          unzip -q /tmp/phase3d-audited.zip -d /tmp/phase3d-audited
          test -s /tmp/phase3d-audited/package.json
          test -s /tmp/phase3d-audited/bun.lock
          cp /tmp/phase3d-audited/package.json package.json
          cp /tmp/phase3d-audited/bun.lock bun.lock

      - name: Re-prove imported dependency graph
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          bun install --frozen-lockfile
          bun audit --audit-level=high
          bunx prisma generate
          bunx tsc --noEmit --pretty false
          git diff --check

      - name: Commit only audited dependency files
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add package.json bun.lock
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'package.json'
          git diff --cached --name-only | grep -Fx 'bun.lock'
          git config user.name 'CHRISTIAN AGBOTAH'
          git config user.email '148919415+christianagbotah@users.noreply.github.com'
          git commit -m 'deps: remediate high-severity audit findings'
          git push origin HEAD:phase-3d-supply-chain-security
