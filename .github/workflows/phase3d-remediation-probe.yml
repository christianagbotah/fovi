name: Phase 3D Dependency Remediation Probe

on:
  push:
    branches:
      - phase-3d-supply-chain-security

permissions:
  contents: read

concurrency:
  group: phase3d-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate patched root dependency graph
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.4'

      - name: Regenerate patched root graph
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun add 'next@^16.2.5' 'next-auth@^4.24.15' 'sharp@^0.35.0'
          bun update
          bun install --frozen-lockfile
          git diff -- package.json bun.lock > phase3d-dependency-remediation.patch
          test -s phase3d-dependency-remediation.patch

      - name: Audit regenerated graph
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun audit --audit-level=high 2>&1 | tee phase3d-remediation-audit.txt
          echo "audit_exit=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      - name: Upload regenerated dependency files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3d-remediated-root-${{ github.run_id }}
          path: |
            package.json
            bun.lock
            phase3d-dependency-remediation.patch
            phase3d-remediation-audit.txt
          if-no-files-found: error
          retention-days: 1
